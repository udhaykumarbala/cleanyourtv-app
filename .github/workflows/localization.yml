name: localization

on:
  push:
    paths:
      - '**/res/**'
      - '**/LocalizationTest.kt'
      - 'scripts/tests/test_localization.py'
      - '.github/workflows/localization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Check translation coverage, ICU arguments and shared resource names
        run: python3 -m unittest discover -s scripts/tests -p test_localization.py -v
      - name: Check, test and assemble both store flavours
        run: ./gradlew check :app:assembleDebug --console=plain
      - name: Upload debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: multilingual-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localization-diagnostics
          path: |
            **/build/reports/
            **/build/test-results/
