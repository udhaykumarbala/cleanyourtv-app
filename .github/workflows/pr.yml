# Build and test on every push and pull request. Linux runners only. Every action is pinned by
# commit (bump them by a reviewed change; the comment names the tag the commit belongs to).
#
# Steps: the pins and the module graph, unit tests with Android Lint (`check`, both store
# flavours of the app: full and play, STORES-PLAN 1), the screenshot goldens (Roborazzi verify),
# the debug builds of both flavours, the release APK (full) and AAB (play) through R8 with the size
# gate on both, and the Python tests of the release and redaction scripts (and of F-Droid's update
# check, test_fdroid_recipe.py) with a redaction check over the fixtures. Nothing is signed.
name: pr

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true   # third_party/cleanyourtv at the pinned launcher commit
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Pins (bundled launcher and TV curtain) and module graph rules
        run: ./gradlew :core:trust:verifyLauncherPin :core:trust:verifyCurtainPin checkModuleGraph --console=plain

      - name: Unit tests, Android Lint and the screenshot goldens
        run: ./gradlew check verifyRoborazziDebug --continue --console=plain

      - name: Debug builds, the release APK and AAB through R8, and the size gate (both flavours)
        run: ./gradlew :app:assembleDebug :app:assembleFullRelease :app:bundlePlayRelease :app:checkApkSizeRelease --console=plain

      - name: Script tests and the fixture redaction check
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 scripts/check-redaction.py fixtures/

      - name: Upload installable APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/outputs/roborazzi/
            **/build/test-results/
          retention-days: 7
