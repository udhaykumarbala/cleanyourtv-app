# The build box (forge, 3 GB container) and CI runners are small: one Gradle JVM, Kotlin in process.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Test builds only (0.3.5-test1 on branch test-lists, 0.3.6-beta1 on test-lists2, 0.3.8-beta1 on
# test-lists3, 0.3.8-beta2 on test-lists4, 0.4.5-beta1 on up300-beta): bundle the candidate lists in
# core/spec/candidates.
# scripts/release-on-forge.sh takes no Gradle property, so the flag is on here; -Pcyt.candidates=false
# builds without them.
cyt.candidates=true
# Test builds only (0.4.6-beta2 on up300-beta): R0, the switch with the setup wizard left on, for every
# brand instead of Xiaomi only (core/planner, HomeSwitchRisk). scripts/check-apk.py refuses the marker
# in any version that is not a pre-release.
cyt.wizardStaysAnyBrand=true
