# The build box (forge, 3 GB container) and CI runners are small: one Gradle JVM, Kotlin in process.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# The 0.4.8 release: no test switch is set here, so the release bundles no planner marker (the candidate
# lists, R0 for every brand, the Home button helper). The test builds 0.4.8-beta1 and beta2 (branches beta048
# and fix-beta2) set cyt.candidates, cyt.wizardStaysAnyBrand and cyt.homeHelper to true in this file; a test
# build off this branch sets them again. scripts/check-apk.py refuses the planner markers in any version that
# is not a pre-release.
