# The build box (forge, 3 GB container) and CI runners are small: one Gradle JVM, Kotlin in process.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Test build 0.4.8-beta1 only (branch beta048, from v0.4.7). scripts/release-on-forge.sh takes no Gradle property, so
# the switches are on here: the candidate lists; R0, the switch with the setup wizard left on, for every
# brand (core/planner HomeSwitchRisk); and the opt-in Home button helper (RFC-HELPER-1).
# scripts/check-apk.py refuses the planner markers in any version that is not a pre-release.
cyt.candidates=true
cyt.wizardStaysAnyBrand=true
cyt.homeHelper=true
