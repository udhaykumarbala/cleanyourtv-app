Builds:
  - versionName: 0.3.0
    versionCode: 3
    commit: c5e08a8962442f3228bf4bbc314efc639a852298
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y apksigcopier
    gradle:
      - full
    rm:
      - android/platform/src/main/assets/bundled/cleanyourtv-launcher.apk
      - android/platform/src/main/assets/bundled/cleanyourtv-curtain.apk
    prebuild: sed -i -e '/signingConfig signingConfigs.debug/d' ../third_party/cleanyourtv/launcher/app/build.gradle
    scanignore:
      - android/platform/signatures/cleanyourtv-launcher/APKSigningBlock
      - android/platform/signatures/cleanyourtv-curtain/APKSigningBlock
    build: bash ../scripts/fdroid-build-tv-apks.sh

